name: APK Android

# Génère le fichier d'installation Android (APK) et le publie dans les « Releases » du dépôt.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (si les secrets sont en place)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vtcrentable.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/vtcrentable.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vtc-rentable.apk"
          else
            echo "::warning::Secrets de signature absents : APK de test (signature de test, barre d'adresse visible)."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/vtc-rentable.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vtc-rentable-apk
          path: vtc-rentable.apk

      - name: Publier l'APK signé (lien de téléchargement fixe)
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "VTC Rentable pour Android" --notes "Fichier d'installation Android (APK) de VTC Rentable."
          gh release upload android-latest vtc-rentable.apk --clobber
